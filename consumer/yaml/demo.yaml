apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  containers:
  - name: web
    image: nginx:latest
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: victim
spec:
  type: ClusterIP
  selector:
    app: victim
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  labels:
    app: attacker
spec:
  containers:
  - name: attacker
    image: nginx:latest
    # Override the default nginx start command so it just idles, allowing us to exec into it
    command: ["/bin/sh", "-c", "sleep infinity"]